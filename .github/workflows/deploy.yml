# Publica os sites públicos da COGEDE no VPS (Plesk, assinatura cogede.com.br).
#
#   institucional/  -> www.cogede.com.br         (HTML estático, sem build)
#   parcerias/      -> parcerias.cogede.com.br   (Vite: build e envio de dist/)
#
# Push na main publica só o site cuja pasta mudou; "Run workflow" escolhe.
# As pastas no servidor são fixas aqui (não vêm de secret) e o rsync --delete
# só mira a raiz exata de cada site: httpdocs e parcerias.cogede.com.br são
# irmãs de painel.cogede.com.br, que é do cogede-app e não é tocada.
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY_B64 (ou VPS_SSH_KEY) — os mesmos do
# cogede-app, porque os três domínios são da mesma assinatura no Plesk.
# Variável: DEPLOY_VPS = 'true' liga o deploy automático a cada push.
#
# "Run workflow" com "simular" marcado roda o rsync em --dry-run: lista o que
# seria enviado e apagado no servidor, sem mudar nada. Use antes do 1º deploy.
name: Deploy dos sites

on:
  push:
    branches: [main]
    paths:
      - 'institucional/**'
      - 'parcerias/**'
  workflow_dispatch:
    inputs:
      site:
        description: 'Qual site publicar'
        type: choice
        options: [ambos, institucional, parcerias]
        default: ambos
      simular:
        description: 'Só simular (rsync --dry-run, não muda o servidor)'
        type: boolean
        default: true

concurrency:
  group: deploy-sites
  cancel-in-progress: true

jobs:
  escolha:
    if: vars.DEPLOY_VPS == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      institucional: ${{ steps.f.outputs.institucional }}
      parcerias: ${{ steps.f.outputs.parcerias }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENTO: ${{ github.event_name }}
          SITE: ${{ inputs.site }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            [ "$SITE" = "ambos" ] || [ "$SITE" = "institucional" ] && echo "institucional=true" >> "$GITHUB_OUTPUT"
            [ "$SITE" = "ambos" ] || [ "$SITE" = "parcerias" ] && echo "parcerias=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ANTES" ] || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            echo "institucional=true" >> "$GITHUB_OUTPUT"; echo "parcerias=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mudou=$(git diff --name-only "$ANTES" "$GITHUB_SHA")
          echo "$mudou" | grep -q '^institucional/' && echo "institucional=true" >> "$GITHUB_OUTPUT"
          echo "$mudou" | grep -q '^parcerias/' && echo "parcerias=true" >> "$GITHUB_OUTPUT"
          true

  deploy:
    needs: escolha
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: institucional
            url: https://www.cogede.com.br
            path: /var/www/vhosts/cogede.com.br/httpdocs
            marcador: 'COGEDE - Cooperativa de Geração Distribuída Emersol'
          - site: parcerias
            url: https://parcerias.cogede.com.br
            path: /var/www/vhosts/cogede.com.br/parcerias.cogede.com.br
            marcador: 'Monetize sua Energia Solar'
    steps:
      - name: Pular se o site não mudou
        id: pular
        run: |
          quer="${{ needs.escolha.outputs[matrix.site] }}"
          [ "$quer" = "true" ] && echo "rodar=true" >> "$GITHUB_OUTPUT" || echo "Nada a publicar para ${{ matrix.site }}."

      - uses: actions/checkout@v4
        if: steps.pular.outputs.rodar == 'true'

      - uses: actions/setup-node@v4
        if: steps.pular.outputs.rodar == 'true' && matrix.site == 'parcerias'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parcerias/package-lock.json

      - name: Build
        if: steps.pular.outputs.rodar == 'true' && matrix.site == 'parcerias'
        working-directory: parcerias
        run: npm ci && npm run build

      # version.txt com o commit: é o que a conferência no fim procura no
      # domínio, para não ficar verde servindo a versão antiga.
      - name: Marcar versão
        if: steps.pular.outputs.rodar == 'true'
        run: |
          origem=${{ matrix.site == 'parcerias' && 'parcerias/dist' || 'institucional' }}
          echo "$GITHUB_SHA" > "$origem/version.txt"

      - name: Configurar chave SSH
        if: steps.pular.outputs.rodar == 'true'
        env:
          KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          KEY_TXT: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY_B64" ]; then
            printf '%s' "$KEY_B64" | tr -d ' \n\r\t' | base64 -d > ~/.ssh/id_deploy
          elif [ -n "$KEY_TXT" ]; then
            printf '%s\n' "$KEY_TXT" | sed 's/\r$//' > ~/.ssh/id_deploy
          else
            echo "::error::Nenhum secret de chave (VPS_SSH_KEY_B64 ou VPS_SSH_KEY)."; exit 1
          fi
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::Chave privada inválida."; exit 1; }
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete tira do servidor o que saiu do site; .well-known (validação do
      # Let's Encrypt) e os arquivos do Plesk ficam. O index.html vai por último.
      - name: Enviar
        if: steps.pular.outputs.rodar == 'true'
        env:
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular }}
          DESTINO_PATH: ${{ matrix.path }}
        run: |
          case "$DESTINO_PATH" in
            /var/www/vhosts/cogede.com.br/httpdocs|/var/www/vhosts/cogede.com.br/parcerias.cogede.com.br) ;;
            *) echo "::error::Pasta de destino inesperada: $DESTINO_PATH"; exit 1 ;;
          esac
          origem=${{ matrix.site == 'parcerias' && 'parcerias/dist' || 'institucional' }}
          destino="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$DESTINO_PATH/"
          seco=""
          [ "$SIMULAR" = "true" ] && seco="--dry-run --itemize-changes" && echo "::notice::Simulação: nada muda no servidor."
          rsync -az $seco --delete --exclude 'index.html' --exclude '.well-known' \
            --exclude '.php-ini' --exclude '.php-version' --exclude 'cgi-bin' \
            -e "ssh -i ~/.ssh/id_deploy" "$origem/" "$destino"
          rsync -az $seco -e "ssh -i ~/.ssh/id_deploy" "$origem/index.html" "$destino"

      # Duas conferências, lendo o version.txt servido:
      #  1. direto no VPS (--resolve): os arquivos chegaram e o certificado vale;
      #  2. pelo DNS público: é o que os visitantes recebem.
      # O marcador confirma que a página é o site certo, não uma página do Plesk.
      - name: Conferir se a versão nova está no ar
        if: steps.pular.outputs.rodar == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.simular)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          URL: ${{ matrix.url }}
          MARCADOR: ${{ matrix.marcador }}
        run: |
          host=$(echo "$URL" | sed -E 's#^https?://([^/]+).*#\1#')
          versao() { curl -sS --max-time 20 "$@" "$URL/version.txt?v=$GITHUB_SHA" | head -c 40 || true; }

          no_vps=$(versao --resolve "$host:443:$VPS_HOST")
          if [ "$no_vps" != "$GITHUB_SHA" ]; then
            echo "::error::O VPS não serve a versão nova em $host (veio '${no_vps:0:40}'), ou o certificado não vale. No Plesk: SSL/TLS Certificates > Let's Encrypt para $host."
            exit 1
          fi
          if ! curl -sS --max-time 20 --resolve "$host:443:$VPS_HOST" "$URL/" | grep -q "$MARCADOR"; then
            echo "::error::$URL no VPS não devolve a página do site (marcador '$MARCADOR' ausente)."
            exit 1
          fi
          if [ "${{ matrix.site }}" = "parcerias" ] && ! curl -sS --max-time 20 --resolve "$host:443:$VPS_HOST" "$URL/rota-qualquer" | grep -q "$MARCADOR"; then
            echo "::error::Rota da SPA sem fallback para o index.html (confira o .htaccess ou as diretivas do nginx no Plesk)."
            exit 1
          fi

          for t in 1 2 3 4 5 6; do
            publico=$(versao)
            [ "$publico" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          ip=$(getent ahostsv4 "$host" | awk 'NR==1{print $1}')
          if [ "$publico" != "$GITHUB_SHA" ]; then
            echo "::error::$host resolve para $ip e não serve a versão nova. Confira o registro A na GoDaddy: deve apontar para $VPS_HOST."
            exit 1
          fi
          echo "$URL no ar com $GITHUB_SHA (DNS -> $ip)."
